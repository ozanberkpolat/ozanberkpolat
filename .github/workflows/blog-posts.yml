name: Latest blog posts
on:
  schedule:
    - cron: "0 5 * * *" # 08:00 TRT
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.obp.com.tr/feed.xml"
          max_post_count: 5
          template: "<li><a href=\"$url\">$title</a> <sub>$date</sub></li>$newline"
          date_format: "mmm d, yyyy"
